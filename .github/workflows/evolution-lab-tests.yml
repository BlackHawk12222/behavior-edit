name: Evolution Lab pure-Python checks

on:
  push:
    paths:
      - "evolution_lab/**"
      - ".github/workflows/evolution-lab-tests.yml"
  pull_request:
    paths:
      - "evolution_lab/**"
      - ".github/workflows/evolution-lab-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate benchmark file
        run: |
          python -m evolution_lab validate
          python -m evolution_lab benchmark
      - name: Run unit tests without installing ML packages
        run: python -m unittest discover -s evolution_lab/tests -v

  tensor-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and optional training dependencies
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.49,<5' 'peft>=0.14,<0.19' 'accelerate>=1,<2' safetensors
      - name: Require tensor dependencies (avoid silent skipped tests)
        run: python -c 'import torch; from transformers import LlamaConfig, LlamaForCausalLM; from peft import LoraConfig, TaskType, get_peft_model, PeftModel'
      - name: Run offline tensor integration tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m unittest discover -s evolution_lab/tests -p test_torch_integration.py -v
